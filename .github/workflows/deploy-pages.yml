name: Deploy World Fabric to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # docusaurus.config.ts n'ajoute le lien de retour que si la variable
      # est posee : la fiche du travail est la porte d'entree cote vitrine.
      LIGNE_DE_CRETE_URL: https://www.ligne-de-crete.fr/travaux/world-fabric/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard public build
        run: |
          test -d data/internal
          if find data/internal -type f ! -name '.gitkeep' | grep -q .; then
            echo "Internal data exist: allowed in repository, but verify no build step copies data/internal.";
          fi
      - name: Install
        working-directory: website
        # `npm ci` et non `npm install` : le verrou est desormais versionne,
        # donc la construction en integration continue installe exactement ce
        # qui a ete construit ici.
        run: npm ci --no-audit --no-fund
      - name: Install Python tooling
        run: pip install -r requirements-dev.txt
      - name: Validate registers against their schemas
        run: python3 scripts/validate_records.py
      - name: Sync canonical research docs
        run: python3 scripts/sync_docs.py
      - name: Derive site data from canonical sources
        run: python3 scripts/build_site_data.py
      - name: Build
        working-directory: website
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
